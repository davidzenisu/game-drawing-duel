[project]
name = "game-drawing-duel-backend"
version = "0.1.0"
description = "Backend API for Game Drawing Duel"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "azure-functions>=1.18.0",
    "azure-identity>=1.26.0",
    "azure-storage-blob>=12.31.0",
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.10",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
