name: Backend Validation

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-validation.yml'

concurrency:
  group: backend-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    name: Lint and Test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run python -m unittest discover -s tests -v

  migrations:
    runs-on: ubuntu-latest
    name: Database Migrations
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: game-drawing-duel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/game-drawing-duel
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Apply all migrations
        run: uv run alembic upgrade head

      # Fails when the models changed without a matching migration.
      - name: Check that no new migrations are required
        run: uv run alembic check

      - name: Downgrade and upgrade again
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
