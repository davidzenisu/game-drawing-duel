name: Azure Functions CI/CD

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/azure-functions-deployment.yml'

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    # Never run two migrations against the same database at once.
    concurrency:
      group: backend-deployment-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Function App name
        id: get_function_app_name
        uses: Azure/cli@v3
        env:
          AZURE_KEY_VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME }}
        with:
          inlineScript: |
            app_name=$(az keyvault secret show --vault-name "$AZURE_KEY_VAULT_NAME" --name "function-app-name" --query "value" -o tsv)
            echo "app_name=$app_name" >> "$GITHUB_OUTPUT"

      - name: Get database connection
        uses: Azure/cli@v3
        env:
          AZURE_KEY_VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME }}
        with:
          inlineScript: |
            database_url=$(az keyvault secret show --vault-name "$AZURE_KEY_VAULT_NAME" --name "database-url" --query "value" -o tsv)
            if [ -z "$database_url" ]; then
              echo "::error::The Key Vault secret database-url is missing or empty."
              exit 1
            fi
            echo "::add-mask::$database_url"
            echo "DATABASE_URL=$database_url" >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: '3.12'

      # Migrate before deploying so new code never runs against an old schema.
      # The environment lives outside backend/ so it isn't part of the package.
      - name: Run database migrations
        working-directory: backend
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/backend-venv
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          uv sync --locked
          uv run alembic upgrade head

      # Stops the deployment if the deployed models don't match the migrated
      # schema (a missing migration, or manual changes to the database).
      - name: Check that the schema matches the models
        working-directory: backend
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/backend-venv
          PYTHONDONTWRITEBYTECODE: '1'
        run: uv run alembic check

      # GET /health reports it as `version`, see the last step.
      - name: Mark the build with its commit
        run: echo "$GITHUB_SHA" > backend/app/commit.txt

      - name: Deploy Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.get_function_app_name.outputs.app_name }}
          package: backend
          remote-build: true

      - name: Get API address
        id: get_api_url
        uses: Azure/cli@v3
        env:
          AZURE_KEY_VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME }}
        with:
          inlineScript: |
            api_url=$(az keyvault secret show --vault-name "$AZURE_KEY_VAULT_NAME" --name "api-custom-domain" --query "value" -o tsv)
            echo "api_url=$api_url" >> "$GITHUB_OUTPUT"

      # The deploy step only reports that Azure accepted the package; the
      # switch to it happens afterwards and has failed silently before, once
      # leaving the old code running and once every route at 404. Fail the run
      # unless the live API reports this commit within 10 minutes.
      - name: Check that the new code is live
        env:
          API_URL: ${{ steps.get_api_url.outputs.api_url }}
        run: |
          api="${API_URL%/}"
          case "$api" in http://*|https://*) ;; *) api="https://$api" ;; esac
          body="$RUNNER_TEMP/health.json"
          for attempt in $(seq 1 40); do
            status=$(curl -sS --max-time 10 -o "$body" -w '%{http_code}' "$api/health" || true)
            live=$(jq -r '.version // empty' "$body" 2>/dev/null || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "The API serves $GITHUB_SHA."
              exit 0
            fi
            echo "Waiting for $GITHUB_SHA (attempt $attempt of 40): HTTP ${status:-none}, $(head -c 300 "$body" 2>/dev/null | tr -d '\n')"
            rm -f "$body"
            sleep 15
          done
          echo "::error::The API still doesn't serve $GITHUB_SHA after 10 minutes. Re-run this job or restart the Function App; the migrations already ran."
          exit 1
