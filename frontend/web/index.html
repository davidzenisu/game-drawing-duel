<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Draw your friends as heroes and challengers, then pull them in a gacha and let them fight.">

  <!-- The installed app's title/status bar and the page behind Flutter take
    the theme's background (AppPalette.surfaceLight / surfaceDark). -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FDF7FF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141218">
  <style>
    body { background-color: #FDF7FF; margin: 0; }
    @media (prefers-color-scheme: dark) { body { background-color: #141218; } }

    /* Shown until Flutter's first frame, so a (re)load never looks blank. */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      transition: opacity 200ms ease-out;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading img { width: 96px; height: 96px; border-radius: 24px; }
    #loading .spinner {
      width: 32px;
      height: 32px;
      box-sizing: border-box;
      border: 4px solid rgba(103, 80, 164, 0.2);
      border-top-color: #6750A4;
      border-radius: 50%;
      animation: loading-spin 900ms linear infinite;
    }
    @media (prefers-color-scheme: dark) {
      #loading .spinner { border-color: rgba(208, 188, 255, 0.2); border-top-color: #D0BCFF; }
    }
    @keyframes loading-spin { to { transform: rotate(360deg); } }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Drawing Duel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Drawing Duel</title>
  <link rel="manifest" href="manifest.json">
  <!-- Reloads the app if the browser dropped Flutter's drawing surface while
    it was in the background; runs before Flutter starts. -->
  <script src="context_recovery.js"></script>
  <!-- Keeps a pen stroke going when the browser briefly reports the pen as
    not pressed (Chrome on Android); runs before Flutter starts. -->
  <script src="pen_fix.js"></script>
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.24/auth0-spa-js.production.js" defer></script>
</head>

<body>
  <div id="loading" aria-label="Loading">
    <img src="icons/Icon-192.png" alt="">
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (!loading) return;
      loading.classList.add('done');
      setTimeout(function () { loading.remove(); }, 300);
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" defer></script>
</body>

</html>
